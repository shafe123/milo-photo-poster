version: 2
updates:
# Python dependencies
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "sunday"
    time: "09:00"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "python"
  commit-message:
    prefix: "chore(deps)"
  # Group minor and patch updates together to reduce PR noise
  groups:
    production-dependencies:
      patterns:
      - "*"
      update-types:
      - "minor"
      - "patch"
